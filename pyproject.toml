[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rekey"
dynamic = ["version"]
description = "Reissue an API key with one command and update it everywhere it is used (1Password + templates)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Jin Kim" }]

[project.urls]
Homepage = "https://github.com/golbin/rekey"

[project.scripts]
rekey = "rekey_lib.cli:main"

[tool.setuptools]
packages = ["rekey_lib"]

[tool.setuptools.dynamic]
version = { attr = "rekey_lib.__version__" }
